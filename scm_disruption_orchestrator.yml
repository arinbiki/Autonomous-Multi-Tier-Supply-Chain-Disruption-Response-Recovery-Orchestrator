          \ and isinstance(weather_api_key, str) and weather_api_key.strip():\n  \
          \      try:\n            url_ow = f\"https://api.openweathermap.org/data/2.5/weather?lat=51.92&lon=4.48&appid={weather_api_key.strip()}&units=metric\"\
          \n            req_ow = urllib.request.Request(url_ow, headers={\"User-Agent\"\
