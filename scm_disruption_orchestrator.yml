          \        \"primary_entity\": str(meta.get(\"primary_entity\") or \"Port\
          \ of Rotterdam\"),\n        \"duration_days\": float(meta.get(\"estimated_duration_days\"\
          ) or 18.0),\n        \"impact_summary\": str(meta.get(\"immediate_impact\"\
          ) or \"Container terminal berths halted\")\n    }\n"
        code_language: python3
