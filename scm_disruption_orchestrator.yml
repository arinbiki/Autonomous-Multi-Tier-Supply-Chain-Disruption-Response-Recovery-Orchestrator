    - data:
        code: "def main(meta_raw: str, urgency: str) -> dict:\n    import json, time,\
          \ uuid, re\n    meta = {}\n    try:\n        m = re.search(r'\\{.*\\}',\
          \ meta_raw, re.DOTALL)\n        if m:\n            meta = json.loads(m.group(0))\n\
          \        else:\n            clean = meta_raw.strip()\n            if clean.startswith(\"\
          ```\"):\n                clean = clean.split(\"\\n\", 1)[1].rsplit(\"```\"\
          , 1)[0]\n            meta = json.loads(clean)\n    except Exception:\n \
          \       pass\n    \n    if not isinstance(meta, dict):\n        meta = {}\n\
          \    \n    incident_id = f\"INC-SCM-{int(time.time())}-{str(uuid.uuid4())[:6].upper()}\"\
          \n    return {\n        \"incident_id\": str(incident_id),\n        \"disruption_type\"\
