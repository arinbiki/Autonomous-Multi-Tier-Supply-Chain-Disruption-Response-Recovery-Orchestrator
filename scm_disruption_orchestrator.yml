          \                if \"wind\" in weather_data:\n                    wind_spd\
          \ = float(weather_data.get(\"wind\", {}).get(\"speed\", 2.69))\n       \
          \             temp = float(weather_data.get(\"main\", {}).get(\"temp\",\
